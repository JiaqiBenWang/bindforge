<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BindForge — Binder Design Pipeline</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; --acc:#38bdf8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--ink); line-height:1.5; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 .25rem; }
    .sub { color: var(--muted); margin:0 0 1.5rem; }
    .card { background: var(--card); border:1px solid #334155; border-radius:12px;
            padding:1.25rem; margin-bottom:1.25rem; }
    label { display:block; font-size:.85rem; color:var(--muted); margin: .75rem 0 .25rem; }
    input, textarea { width:100%; padding:.6rem .7rem; border-radius:8px; border:1px solid #334155;
            background:#0f172a; color:var(--ink); font: inherit; }
    textarea { min-height:80px; resize:vertical; }
    .row { display:flex; gap:1rem; flex-wrap:wrap; }
    .row > div { flex:1; min-width:130px; }
    button { margin-top:1.25rem; padding:.7rem 1.4rem; border:0; border-radius:8px;
            background:var(--acc); color:#06131f; font-weight:600; cursor:pointer; }
    button:hover { filter:brightness(1.1); }
    table { width:100%; border-collapse:collapse; font-size:.85rem; }
    th, td { text-align:left; padding:.5rem .6rem; border-bottom:1px solid #334155; }
    th { color:var(--muted); font-weight:600; }
    .status { font-weight:600; }
    .status.done { color:#4ade80; } .status.running, .status.queued { color:#fbbf24; }
    .status.failed { color:#f87171; }
    .err { color:#f87171; white-space:pre-wrap; }
    .mono { font-family: ui-monospace, monospace; font-size:.8rem; word-break:break-all; }
    .pill { display:inline-block; padding:.1rem .5rem; border-radius:999px; background:#334155; }
    .hint { color: var(--muted); font-size:.8rem; margin:.25rem 0 0; }
    .log { background:#0b1220; border:1px solid #334155; border-radius:8px; padding:.6rem .8rem;
           font-family: ui-monospace, monospace; font-size:.75rem; color:#7dd3fc;
           max-height:180px; overflow:auto; white-space:pre-wrap; margin-top:.75rem; }
    .val-yes { color:#4ade80; font-weight:600; } .val-no { color:#64748b; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>BindForge</h1>
    <p class="sub">Binder sequence design → structure prediction (Boltz-2 / Chai-1) → MD stability validation.</p>

    <div class="card">
      <label for="file">Target structure — upload a PDB / CIF / FASTA file</label>
      <input id="file" type="file" accept=".pdb,.cif,.mmcif,.fasta,.fa,.faa,.txt" />
      <div class="hint">…or paste a raw amino-acid sequence instead of uploading (used only when no file is chosen):</div>
      <textarea id="target" placeholder="MKTAYIAKQRQISFVKSHFSRQDILDLWIYHTQGYFP"></textarea>
      <div class="row">
        <div><label for="n_designs">Designs</label><input id="n_designs" type="number" value="4" /></div>
        <div><label for="length">Length range</label><input id="length" value="20-25" /></div>
        <div><label for="md_top">MD top-K</label><input id="md_top" type="number" value="2" /></div>
        <div><label for="md_ns">MD ns</label><input id="md_ns" type="number" step="0.1" value="0.05" /></div>
      </div>
      <label><input id="dry_run" type="checkbox" checked /> Dry-run (mock providers, no API keys)</label>
      <button id="submit">Run pipeline</button>
    </div>

    <div class="card">
      <h2 style="margin-top:0">Jobs</h2>
      <table id="jobs">
        <thead><tr><th>ID</th><th>Status</th><th>Results</th><th>Action</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card" id="resultsCard" style="display:none">
      <h2 style="margin-top:0">Results — <span id="resultJobId"></span></h2>
      <div id="error"></div>
      <table id="results">
        <thead><tr>
          <th>#</th><th>Binder</th><th>Len</th><th>Score</th><th>Conf</th>
          <th>MD</th><th>ipTM</th><th>RMSD (nm)</th><th>Contact</th><th>dG</th><th>Sequence</th>
        </tr></thead>
        <tbody></tbody>
      </table>
      <div class="log" id="log" style="display:none"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const fmt = (v, d = 3) => (v === null || v === undefined) ? '—' : (typeof v === 'number' ? v.toFixed(d) : v);

    async function submitJob() {
      const file = $('file').files[0];
      const params = {
        n_designs: parseInt($('n_designs').value) || 8,
        length: $('length').value || '50-80',
        md_top: parseInt($('md_top').value) || 2,
        md_ns: parseFloat($('md_ns').value) || 5.0,
        dry_run: $('dry_run').checked,
      };
      let j;
      if (file) {
        const fd = new FormData();
        fd.append('file', file);
        for (const [k, v] of Object.entries(params)) fd.append(k, v);
        const r = await fetch('/api/upload', { method: 'POST', body: fd });
        j = await r.json();
      } else {
        const seq = $('target').value.trim();
        if (!seq) { alert('Upload a structure file, or paste a target sequence.'); return; }
        const r = await fetch('/api/jobs', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ target: seq, ...params }) });
        j = await r.json();
      }
      if (j.id) pollJob(j.id);
    }

    async function pollJob(id) {
      const r = await fetch('/api/jobs/' + id);
      const j = await r.json();
      refreshJobs();
      showProgress(id, j);
      if (j.status === 'done' || j.status === 'failed') { showResult(id, j); return; }
      setTimeout(() => pollJob(id), 2000);
    }

    function showProgress(id, j) {
      const log = $('log');
      if (j.logs && j.logs.trim()) {
        $('resultsCard').style.display = 'block';
        $('resultJobId').textContent = id;
        log.style.display = 'block';
        log.textContent = j.logs;
        log.scrollTop = log.scrollHeight;
      }
    }

    async function refreshJobs() {
      const r = await fetch('/api/jobs'); const d = await r.json();
      const tbody = $('jobs').querySelector('tbody'); tbody.innerHTML = '';
      for (const j of d.jobs) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="mono">${j.id}</td>
          <td><span class="status ${j.status}">${j.status}</span></td>
          <td>${j.n_results}</td>
          <td><button onclick="pollJob('${j.id}')" style="margin:0;padding:.3rem .8rem">view</button></td>`;
        tbody.appendChild(tr);
      }
    }

    function showResult(id, j) {
      $('resultsCard').style.display = 'block';
      $('resultJobId').textContent = id;
      $('error').innerHTML = j.error ? `<div class="err">${j.error}</div>` : '';
      const tbody = $('results').querySelector('tbody'); tbody.innerHTML = '';
      for (const row of (j.result || [])) {
        const tr = document.createElement('tr');
        const md = row.validated
          ? `<span class="val-yes">✓</span>`
          : `<span class="val-no">—</span>`;
        tr.innerHTML = `<td>${row.rank}</td><td class="mono">${row.binder_id}</td>
          <td>${row.length}</td><td>${fmt(row.score)}</td><td>${fmt(row.confidence)}</td>
          <td>${md}</td><td>${fmt(row.ipTM, 2)}</td><td>${fmt(row.md_rmsd_mean, 2)}</td>
          <td>${row.md_contact_retention === null ? '—' : (row.md_contact_retention * 100).toFixed(0) + '%'}</td>
          <td>${fmt(row.md_dG, 1)}</td><td class="mono">${row.sequence}</td>`;
        tbody.appendChild(tr);
      }
    }

    $('submit').onclick = submitJob;
    refreshJobs();
  </script>
</body>
</html>
