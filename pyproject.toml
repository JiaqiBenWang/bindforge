[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bindforge"
version = "0.1.0"
description = "Protein binder design pipeline: design -> structure prediction (Boltz-2 / Chai-1) -> MD validation (OpenMM)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "JiaqiBenWang" }]
keywords = ["protein", "binder", "design", "boltz", "chai", "alphafold", "molecular-dynamics", "openmm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.21",
    "httpx>=0.24",
]

[project.optional-dependencies]
md = ["openmm>=8.0"]
web = ["fastapi>=0.100", "uvicorn>=0.20", "pydantic>=1.10,<3"]
dev = ["pytest"]

[project.scripts]
bindforge = "binderforge.cli:main"

[tool.setuptools]
packages = ["binderforge", "binderforge.providers", "binderforge.md"]
